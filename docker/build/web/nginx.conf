server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;
    gzip_static on;

    # 后端接口
    location /prod-api/ {
        proxy_pass http://backend:9114/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # WebSocket（检测事件 / 实时推送）
    location /websocket/ {
        proxy_pass http://backend:9114;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # 静态抓拍与录像文件服务（挂载自 sva-upload）
    location /alarm/ {
        alias /usr/share/nginx/upload/alarm/;
    }

    location /zlm/ {
        alias /usr/share/nginx/upload/storage/;
    }

    location /upload/ {
        alias /usr/share/nginx/upload/;
    }

    # 仅代理播放路径，媒体管理 API 不对公网开放。
    location /media/index/ { return 404; }
    location /media/ {
        proxy_pass http://media:9992/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 前端单页路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
