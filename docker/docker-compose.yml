# =====================================================================
# easySVA 一键编排（路线A：已编译二进制打包，组员无需编译）
# 启动：docker compose up -d
# 带国标模拟摄像头一起：默认已包含；浏览器打开 http://localhost:8080
# =====================================================================
services:

  mysql:
    image: mariadb:10.6
    container_name: sva-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --lower_case_table_names=0
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_PASSWORD:-easySVA.EZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-easySVA.EZ}
      MARIADB_DATABASE: ${MYSQL_DB:-easySVA}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./build/mysql-init:/docker-entrypoint-initdb.d:ro
    networks: [sva-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD:-easySVA.EZ}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sva-redis
    command: redis-server --databases 16
    networks: [sva-net]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 媒体+国标一体容器：ZLMediaKit + GB28181 信令 + 转桥
  media:
    build:
      context: ./build/media
    image: easysva-media:1.0
    container_name: sva-media
    environment:
      ZLM_SECRET: ${ZLM_SECRET:-V3522025zlm0aA9ajn7UiOWi}
      PLATFORM_ID: ${PLATFORM_ID:-34020000002000000001}
      REALM: ${REALM:-3402000000}
      DEVICE_PASSWORD: ${DEVICE_PASSWORD:-12345678}
      SIP_ADVERTISED_IP: media
      ENABLE_BRIDGE: "1"
      GB_DEVICE_ID: ${GB_DEVICE_ID:-34020000001320000001}
      GB_CHANNEL_ID: ${GB_CHANNEL_ID:-34020000001320000002}
      TARGET_STREAM: ${TARGET_STREAM:-gb_34020000001320000002_0100000016}
    ports:
      - "9992:9992"                              # HTTP/WS-FLV（浏览器拉流）
      - "9994:9994"                              # RTSP
      - "9995:9995"                              # RTMP
      - "18080:18080"                            # 国标管理 API
      - "5060:5060/udp"                          # SIP（接真实国标摄像头）
      - "5060:5060/tcp"
      - "30002-30100:30002-30100/udp"            # GB RTP 收流端口段
    volumes:
      - sva-upload:/opt/media/upload             # 告警录像落 storage/，与 analyzer/web 共享
    networks: [sva-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',9992),2).close()\""]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  analyzer:
    build:
      context: ./build/analyzer
    image: easysva-analyzer:1.0
    container_name: sva-analyzer
    environment:
      BACKEND_HOST: backend
      ZLM_SECRET: ${ZLM_SECRET:-V3522025zlm0aA9ajn7UiOWi}
      BIND_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sva-upload:/app/upload                    # 告警抓拍落 alarm/，与 media/web 共享
    networks: [sva-net]
    depends_on:
      media:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./build/backend
    image: easysva-backend:1.0
    container_name: sva-backend
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-easySVA.EZ}
      MYSQL_DB: ${MYSQL_DB:-easySVA}
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9114:9114"        # 仅本机调试用，不对外
    networks: [sva-net]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      media:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./build/web
    image: easysva-web:1.0
    container_name: sva-web
    ports:
      - "${WEB_PORT:-80}:80"      # 与图片/录像 URL 的 80 端口保持一致
    volumes:
      - sva-upload:/usr/share/nginx/upload:ro   # 只读共享抓拍 alarm/ 与录像 storage/
    networks: [sva-net]
    depends_on:
      - backend
    restart: unless-stopped

  # 国标模拟摄像头（默认启动，自动注册并循环推送瞌睡视频；不需要可 docker compose stop simulator）
  simulator:
    build:
      context: ./build/simulator
    image: easysva-simulator:1.0
    container_name: sva-simulator
    environment:
      PLATFORM_HOST: media
      PLATFORM_ID: ${PLATFORM_ID:-34020000002000000001}
      REALM: ${REALM:-3402000000}
      DEVICE_ID: ${GB_DEVICE_ID:-34020000001320000001}
      CHANNEL_ID: ${GB_CHANNEL_ID:-34020000001320000002}
      DEVICE_PASSWORD: ${DEVICE_PASSWORD:-12345678}
      HEARTBEAT_INTERVAL: "15"
    networks: [sva-net]
    depends_on:
      media:
        condition: service_healthy
    restart: unless-stopped

networks:
  sva-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  sva-upload:    # analyzer 抓拍 + media 录像的共享存储，供 web(nginx) 只读对外提供
