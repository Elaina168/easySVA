# X-AnyLabeling 自定义模型配置 - YOLO26 定制版
type: yolo26                     # yolo26
name: yolo26s_miner
display_name: YOLOv26s-Miner (8 classes)
model_path: yolo26s_miner.onnx         # 同目录下的 ONNX 文件

# 输入尺寸（使用训练时的默认尺寸 640x640）
input_width: 640
input_height: 640

# 后处理参数（可自行微调）
confidence_threshold: 0.4
nms_threshold: 0.5

# 类别列表（严格按照训练时的顺序，索引 0~7）
classes:
  - helmet_on
  - helmet_off
  - helmet
  - self-rescuer
  - towline
  - support plate
  - track-car
  - crane-hook