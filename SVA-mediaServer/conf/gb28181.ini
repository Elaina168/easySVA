; easySVA GB28181 signaling service configuration
[sip]
; 20-digit platform ID: province/city/county/type/network/sequence
server_id=34020000002000000001

; First 10 digits of the administrative domain
realm=3402000000

; Address announced in Via, Contact, SDP, and device-facing requests.
advertised_ip=127.0.0.1
transaction_timeout_seconds=5

; SIP signaling listener. UDP and TCP can share the same port number.
listen_ip=0.0.0.0
port=5060
udp=true
tcp=true

; Close an inactive TCP/UDP peer session after this interval.
idle_timeout_seconds=180

; Upper bound for a single SIP message, including headers and XML/SDP body.
max_message_bytes=1048576

[registration]
; Digest authentication is the normal GB28181 registration mode.
auth_required=true

; Demonstration password only. Replace it during deployment and do not commit
; a production device password to Git.
device_password=12345678

; Authentication challenge and registration lifetime controls.
nonce_ttl_seconds=300
default_expires_seconds=3600
min_expires_seconds=60
max_expires_seconds=86400

[device]
; A device is marked offline if no REGISTER, Keepalive, or Catalog activity is
; seen during this interval. Registration expiry still removes it completely.
heartbeat_timeout_seconds=90

; ZLMediaKit HTTP API settings are introduced by the media-session stage.
